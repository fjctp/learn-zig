on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: extractions/setup-just@v3
        with:
          just-version: latest

      - run: just tutorial::test

      - run: just kd-tree::test
  